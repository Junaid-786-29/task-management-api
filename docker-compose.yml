services:
  mysql:
    image: mysql:8.4
    container_name: task-management-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Your_ROOT_PASSWORD
      MYSQL_DATABASE: task_management

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: